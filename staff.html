<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111615"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Linc_03.zip — スタッフ用</title><style>
*{box-sizing:border-box}body{margin:0;color:#f4f5ee;background:#111615;font:16px/1.7 -apple-system,BlinkMacSystemFont,sans-serif}button,input{font:inherit;border-radius:9px;padding:12px 16px;border:1px solid #3d4b41}button{cursor:pointer;color:#142013;background:#d3fa85}input{background:#111615;color:#fff;width:100%;margin-top:8px}input:focus{outline:2px solid #d3fa85;outline-offset:2px}main{min-height:100dvh;display:grid;place-items:center;padding:24px}.card{width:min(100%,440px);background:#1a211f;border:1px solid #34413b;border-radius:20px;padding:36px}.brand{font-size:21px;font-weight:850;letter-spacing:3px}.brand span{color:#d3fa85}.eyebrow{font-size:11px;letter-spacing:3px;color:#a4b2ab;margin-top:7px}h1{font-size:27px;margin:36px 0 10px}p{color:#a4b2ab;font-size:14px}label{display:block;font-size:14px;margin-top:28px}.submit{width:100%;margin-top:18px;font-weight:bold}button:disabled{opacity:.6;cursor:wait}#status{min-height:48px;font-size:13px;color:#e6c591;margin:12px 0}small{display:block;color:#a4b2ab;font-size:12px}#workspace{height:100dvh;display:flex;flex-direction:column}#workspace[hidden],main[hidden]{display:none}.tools{padding:8px 16px;display:flex;gap:9px;align-items:center;background:#1a211f;border-bottom:1px solid #34413b}.tools .brand{font-size:13px;margin-right:auto}.tools button{padding:6px 11px;background:#28352b;color:#e5f0de;font-size:12px}.tools button.active{background:#d3fa85;color:#142013}iframe{flex:1;width:100%;border:0;min-height:0;background:#111615}body.signage .tools{display:none}#offline{margin-top:14px;font-size:11px;color:#a4b2ab}@media(max-width:480px){.card{padding:28px}.tools{padding:8px;gap:6px}.tools .brand{display:none}.tools button{flex:1}}
</style><body><main id="login"><section class="card"><div class="brand">Linc<span>_03.zip</span></div><div class="eyebrow">STAFF ACCESS / 実験ドーム</div><h1>当日の進行を、ここで。</h1><p>進行画面・担当表・操作マニュアルを確認できます。スタッフ共通のパスワードを入力してください。</p><form id="form"><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" required><button id="unlock" class="submit" type="submit">進行画面を開く</button><div id="status" role="status" aria-live="polite"></div></form><small>初回はネット接続が必要です。保存完了後は、同じブラウザ・同じURLからオフラインでも開けます。</small><div id="offline">オフライン保存を確認中…</div></section></main>
<div id="workspace" hidden><nav class="tools" aria-label="スタッフメニュー"><div class="brand">Linc<span>_03.zip</span></div><button id="showLive" class="active">進行画面</button><button id="showManual">マニュアル</button><button id="lock">ロック</button></nav><iframe id="view" title="スタッフ用進行画面" allow="fullscreen"></iframe></div>
<script>
const $=id=>document.getElementById(id);let content=null;
function bytes(b64){return Uint8Array.from(atob(b64),c=>c.charCodeAt(0))}
function page(name){if(!content)return;document.body.classList.remove('signage');$('view').srcdoc=content[name];$('showLive').classList.toggle('active',name==='index');$('showManual').classList.toggle('active',name==='manual')}
$('form').addEventListener('submit',async event=>{event.preventDefault();$('unlock').disabled=true;$('status').textContent='パスワードを確認しています…';try{
 if(!crypto.subtle)throw new Error('unsupported');
 const response=await fetch('payload.json',{cache:'no-cache'});if(!response.ok)throw new Error('network');const payload=await response.json();
 const material=await crypto.subtle.importKey('raw',new TextEncoder().encode($('password').value),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
 const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.data));
 content=JSON.parse(new TextDecoder().decode(clear));if(!content.index||!content.manual)throw new Error('data');
 $('password').value='';$('status').textContent='';$('login').hidden=true;$('workspace').hidden=false;page('index');
 }catch(error){$('status').textContent=error.message==='unsupported'?'このブラウザでは開けません。最新のSafari / Chrome / EdgeでHTTPSのURLを開いてください。':error.name==='OperationError'?'パスワードが違います。もう一度入力してください。':'データを開けませんでした。初回はネットに接続してから再度お試しください。';}
 finally{$('unlock').disabled=false;}});
$('showLive').onclick=()=>page('index');$('showManual').onclick=()=>page('manual');$('lock').onclick=()=>{content=null;$('view').srcdoc='';$('workspace').hidden=true;$('login').hidden=false;document.body.classList.remove('signage');$('password').focus();};
window.addEventListener('message',event=>{if(event.source!==$('view').contentWindow||event.origin!==location.origin)return;if(event.data?.type==='dome-nav')page(event.data.page==='manual'?'manual':'index');if(event.data?.type==='dome-signage')document.body.classList.toggle('signage',!!event.data.enabled);});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{$('offline').textContent='オフライン保存済み。次回もパスワードで開けます。'}).catch(()=>{$('offline').textContent='保存できませんでした。ネット接続中は利用できます。'});else $('offline').textContent='オフライン保存には、対応ブラウザでHTTPSのURLを開いてください。';
</script></body></html>
